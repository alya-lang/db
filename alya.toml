[package]
name = "db"
version = "0.2.0"
alya-version = "0.0.20"
entry = "src/lib.alya"
description = "Database driver interface, connection management, and query abstraction for Alya"
authors = ["Alya Language Contributors <https://github.com/alya-lang>"]
license = "MIT"
homepage = "https://github.com/alya-lang/alya"
repository = "https://github.com/alya-lang/db"
keywords = ["alya", "alya-lang", "package", "db", "database", "sql", "driver", "abstraction", "query"]

[dependencies]
sqlite = { git = "https://github.com/alya-lang/sqlite", tag = "v0.2.0", optional = true }

# Optional: feature-gated API slices. The `sqlite` slice (default-on)
# wires the bundled `sqlite` adapter (`src/adapters/sqlite.alya`); slim
# builds (`--no-default-features`) skip both the dependency and the file.
[features]
default = ["sqlite"]
sqlite = ["sqlite"]

